apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo
    app.kubernetes.io/part-of: erp-wms-tms
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -v -w3 postgres-service 5432; do echo "Esperando disponibilidad de PostgreSQL..."; sleep 2; done; echo "PostgreSQL está listo."']
      containers:
        - name: odoo
          image: odoo:19.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8069
              name: http
            - containerPort: 8072
              name: longpolling
          env:
            - name: HOST
              value: "postgres-service"
            - name: PORT
              value: "5432"
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: POSTGRES_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: POSTGRES_PASSWORD
            - name: ODOO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: ODOO_ADMIN_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "3000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: odoo-web-data
              mountPath: /var/lib/odoo
            - name: odoo-extra-addons
              mountPath: /mnt/extra-addons
            - name: odoo-config-volume
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
      volumes:
        - name: odoo-web-data
          persistentVolumeClaim:
            claimName: odoo-web-data-pvc
        - name: odoo-extra-addons
          persistentVolumeClaim:
            claimName: odoo-extra-addons-pvc
        - name: odoo-config-volume
          configMap:
            name: odoo-config
