apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-extra-addons-pvc
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo
    app.kubernetes.io/part-of: erp-wms-tms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
