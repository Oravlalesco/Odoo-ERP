apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-web-data-pvc
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo
    app.kubernetes.io/part-of: erp-wms-tms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
